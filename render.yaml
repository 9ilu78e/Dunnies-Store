services:
  - type: web
    name: dunnies-store
    env: node
    buildCommand: npm ci && npm run db:deploy && NODE_ENV=production npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://dunnies-store.onrender.com
    disk:
      - name: uploads
        mountPath: /opt/render/project/.uploads
        sizeGB: 2
