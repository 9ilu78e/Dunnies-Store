services:
  - type: web
    name: dunnies-store
    env: node
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    disk:
      - name: uploads
        mountPath: /opt/render/project/.uploads
        sizeGB: 2
